name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15
      - uses: golang/govulncheck-action@v1
        with:
          go-version-file: go.mod
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: conformance/package-lock.json
      - run: make test
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t dzstudio-collab-server .
      - name: The image starts and answers its health check
        run: |
          docker run -d --name dzcollab dzstudio-collab-server
          for i in $(seq 1 20); do docker exec dzcollab /dzcollab health && exit 0; sleep 1; done
          docker logs dzcollab
          exit 1
